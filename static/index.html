<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Image Playground</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
      html,
      body {
        min-height: 100%;
      }

      .app-main,
      .history-sidebar {
        min-height: 100vh;
      }

      .gallery-scroll,
      .history-scroll {
        min-height: 0;
      }

      .gallery-image {
        height: 10rem;
        object-fit: cover;
      }

      .selected-image {
        width: 6rem;
        height: 4.5rem;
        object-fit: cover;
      }

      .history-result-image {
        aspect-ratio: 16 / 9;
        max-height: 16rem;
        object-fit: cover;
      }

      .history-source-strip {
        min-width: 0;
      }

      .history-source-thumb {
        width: 2.5rem;
        height: 2rem;
        object-fit: cover;
      }

      @media (min-width: 992px) {
        .app-main,
        .history-sidebar {
          height: 100vh;
          min-height: 0;
          overflow: hidden;
        }
      }
    </style>
  </head>
  <body class="bg-body-tertiary">
    <div class="container-fluid">
      <div class="row g-0 min-vh-100">
        <aside class="col-lg-4 col-xl-3 border-end bg-body history-sidebar d-flex flex-column">
          <div class="p-3 border-bottom">
            <div class="d-flex align-items-center justify-content-between gap-2">
              <h1 class="h5 mb-0">Requests</h1>
              <button id="clearCompletedButton" class="btn btn-sm btn-outline-secondary" type="button">Clear</button>
            </div>
          </div>
          <div id="requestHistory" class="history-scroll overflow-auto p-3 flex-grow-1"></div>
        </aside>

        <main class="col-lg-8 col-xl-9 app-main d-flex flex-column">
          <header class="bg-body border-bottom p-3">
            <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3">
              <div>
                <h2 class="h4 mb-1">Image Playground</h2>
                <div id="appStatus" class="small text-secondary">Loading images...</div>
              </div>
              <button id="refreshImagesButton" class="btn btn-outline-primary" type="button">Refresh</button>
            </div>
          </header>

          <section class="gallery-scroll overflow-auto flex-grow-1 p-3 p-lg-4">
            <div id="galleryAlert" class="alert alert-warning d-none" role="alert"></div>
            <div id="imageGallery" class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-xxl-5 g-3"></div>
            <div id="galleryEmpty" class="text-center text-secondary py-5 d-none">
              <div class="h5">No images yet</div>
            </div>
          </section>

          <section class="border-top bg-body p-3 shadow-sm">
            <div class="d-flex align-items-center justify-content-between mb-2">
              <div class="fw-semibold">Selected images</div>
              <button id="clearSelectionButton" class="btn btn-sm btn-outline-secondary" type="button">Clear selected</button>
            </div>
            <div id="selectedImages" class="d-flex gap-2 overflow-auto pb-2 mb-3"></div>
            <form id="promptForm" class="d-flex flex-column flex-md-row gap-2">
              <label for="promptInput" class="visually-hidden">Prompt</label>
              <input id="promptInput" class="form-control form-control-lg" type="text" autocomplete="off" placeholder="Prompt" required>
              <button id="generateButton" class="btn btn-primary btn-lg px-4" type="submit">Generate</button>
            </form>
          </section>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="/static/app.js" defer></script>
  </body>
</html>
